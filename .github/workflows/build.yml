on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

name: Continuous integration

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        rust:
          - stable
          - 1.92.0  # Minimum supported Rust version

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master on 2026-10-16
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --all-features --all-targets
      - name: Build
        run: cargo build --all-features --all-targets
      - name: Test
        run: cargo test --all-features --all-targets
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Clippy for the web
        run: cargo clippy --target wasm32-unknown-unknown -p neuronify -p neuronify-core -- -D warnings
