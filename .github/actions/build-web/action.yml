name: Build the web app
description: Builds the web app with trunk into a folder that works from any path
inputs:
  dist:
    description: Folder to build into, relative to the repository
    required: true
runs:
  using: composite
  steps:
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master on 2026-10-16
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
    - name: Install trunk and wasm-bindgen
      shell: bash
      run: |
        cargo install --locked trunk@0.21.14
        version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/version = "\(.*\)"/\1/p}' Cargo.lock)
        cargo install --locked wasm-bindgen-cli@"$version"
    - name: Build
      shell: bash
      working-directory: neuronify
      env:
        DIST: ${{ github.workspace }}/${{ inputs.dist }}
      run: trunk build --release --public-url ./ --dist "$DIST"
