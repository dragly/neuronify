[package]
name = "neuronify-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
visula = { git = "https://github.com/dragly/visula", rev = "39cf45ff94f7cf69328a6bfd94b457de71b03bad" }
visula-derive = { git = "https://github.com/dragly/visula", rev = "39cf45ff94f7cf69328a6bfd94b457de71b03bad" }
visula-core = { git = "https://github.com/dragly/visula", rev = "39cf45ff94f7cf69328a6bfd94b457de71b03bad" }
wgpu = { version = "29", features = ["webgl"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.24", features = ["derive"] }
log = "0.4"
miniz_oxide = "0.8"
egui = "0.34"
egui-wgpu = "0.34"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.104"
js-sys = "0.3"
neuronify-engine = { path = "../neuronify-engine" }
hecs = { version = "0.11.1", features = [
  "column-serialize",
  "serde",
  "row-serialize",
] }
rand = "0.8.6"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
postcard = { version = "1.0.8", features = ["use-std"] }
web-sys = { version = "0.3.69", features = [
    "AddEventListenerOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Blob",
    "Document",
    "DomException",
    "Element",
    "File",
    "FileList",
    "FilePropertyBag",
    "GainNode",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Location",
    "Navigator",
    "Node",
    "Performance",
    "Response",
    "ShareData",
    "Storage",
    "StorageManager",
    "Url",
    "UrlSearchParams",
    "Window",
] }
chrono = { version = "0.4.38", features = ["serde"] }
rfd = "0.15.2"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand 0.8 depends on getrandom 0.2, which only builds for the web with its js feature
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.2"
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
png = "0.18"

[build-dependencies]
miniz_oxide = "0.8"

[[example]]
name = "write_examples"
path = "generators/write_examples.rs"

[[example]]
name = "write_labs"
path = "generators/write_labs.rs"

[[example]]
name = "write_tutorial"
path = "generators/write_tutorial.rs"
