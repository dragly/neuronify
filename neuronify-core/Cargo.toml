[package]
name = "neuronify-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
visula = { git = "https://github.com/dragly/visula", rev = "49367fc7b9ca7fcb1fc4a4fe4172ff2766eab56c" }
visula_derive = { git = "https://github.com/dragly/visula", rev = "49367fc7b9ca7fcb1fc4a4fe4172ff2766eab56c" }
visula_core = { git = "https://github.com/dragly/visula", rev = "49367fc7b9ca7fcb1fc4a4fe4172ff2766eab56c" }
wgpu = { version = "29", features = ["webgl"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.24", features = ["derive"] }
log = "0.4"
egui = "0.34"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.104"
js-sys = "0.3"
hecs = { version = "0.10.5", features = [
  "column-serialize",
  "serde",
  "row-serialize",
] }
rand = "0.8.6"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
postcard = { version = "1.0.8", features = ["use-std"] }
web-sys = { version = "0.3.69", features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
] }
chrono = { version = "0.4.38", features = ["serde"] }
rfd = "0.15.2"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand 0.8 depends on getrandom 0.2, which only builds for the web with its js feature
getrandom = { version = "0.2", features = ["js"] }
