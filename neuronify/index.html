<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuronify</title>
    <link data-trunk rel="rust" data-bin="neuronify" data-initializer="loading.js" />
    <link data-trunk rel="icon" href="../neuronify-core/assets/favicon.ico" />
    <link data-trunk rel="copy-dir" href="../neuronify-core/examples" />
    <link data-trunk rel="copy-file" href="neuron-tile.js" />
    <link data-trunk rel="copy-file" href="neuron-icon.js" />
    <link rel="modulepreload" href="neuron-tile.js" />
    <link rel="modulepreload" href="neuron-icon.js" />
    <script>
      if (new URLSearchParams(location.search).has("file")) {
        document.documentElement.classList.add("scene");
      }
    </script>
    <style>
      :root {
        --background: #eceff5;
        --surface: #ffffff;
        --placeholder: rgba(76, 79, 105, 0.13);
        --scene: #f2f5fc;
        --stack-middle: #f2f4f8;
        --stack-back: #f9fafc;
        --shadow: rgba(0, 0, 0, 0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1e1e2e;
          --surface: #313244;
          --placeholder: rgba(205, 214, 244, 0.1);
          --scene: #383a51;
          --stack-middle: #242535;
          --stack-back: #2b2b3d;
          --shadow: rgba(0, 0, 0, 0.38);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--background);
      }
      #glcanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--background);
        transition: opacity 250ms ease-out;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .center {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .tile {
        --size: min(100vw - 72px, 400px, (100vh - 210px) * 1.1);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: var(--size);
        border-radius: calc(0.225 * var(--size));
        background: linear-gradient(#327dda, #1b64c2);
        box-shadow: 0 22px 56px -8px var(--shadow), 0 4px 14px var(--shadow);
      }
      @supports (height: 1dvh) {
        .tile {
          --size: min(100vw - 72px, 400px, (100dvh - 210px) * 1.1);
        }
      }
      #neuron {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 200ms ease-out;
      }
      #neuron.shown {
        opacity: 1;
      }
      .lens .plot {
        visibility: hidden;
      }
      .lens .status {
        border-top-color: transparent;
      }
      .icon {
        width: 100%;
        aspect-ratio: 1;
        margin: -6% 0 -14%;
      }
      .panel {
        position: relative;
        width: 78%;
        margin-bottom: 11%;
      }
      .plot {
        position: relative;
        height: 70px;
        overflow: hidden;
      }
      .window,
      .inner {
        position: absolute;
        inset: 0;
        transition: transform 240ms linear;
        will-change: transform;
      }
      .window {
        overflow: hidden;
        transform: translateX(-100%);
      }
      .inner {
        transform: translateX(100%);
      }
      .inner svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .inner path {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .status {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.84);
        font: 300 13px Ubuntu, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #percent {
        color: #ffffff;
        font: 12.5px Hack, ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      .page {
        width: min(100% - 32px, 1100px);
        margin: 0 auto;
        padding-top: 30px;
      }
      .bar {
        border-radius: 4px;
        background: var(--placeholder);
      }
      .title {
        width: 147px;
        height: 25px;
        margin-bottom: 20px;
      }
      .subtitle {
        width: 292px;
        max-width: 100%;
        height: 12px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        margin: 37.5px 0 19.5px;
      }
      .cards ~ .heading {
        margin-top: 50.5px;
      }
      .heading .bar {
        height: 16px;
      }
      .heading .see-all {
        width: 43px;
        height: 12px;
        margin-top: 2px;
      }
      .see-all[hidden] {
        display: none;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 19px 16px;
      }
      .card {
        padding: 10px 10px 13px;
        border-radius: 10px;
        background: var(--surface);
      }
      .thumbnail {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        background: var(--background);
      }
      .plus::before,
      .plus::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: var(--placeholder);
      }
      .plus::before {
        width: 16.875%;
        height: 2px;
      }
      .plus::after {
        width: 2px;
        height: 30%;
        background: linear-gradient(
          var(--placeholder) calc(50% - 1px),
          transparent 0 calc(50% + 1px),
          var(--placeholder) 0
        );
      }
      .name {
        max-width: 100%;
        height: 12px;
        margin-top: 13px;
      }
      .line {
        max-width: 100%;
        height: 11px;
        margin-top: 9px;
      }
      .line:not([style]) {
        width: 95%;
      }
      .line + .line:not([style]) {
        width: 90%;
        margin-top: 5px;
      }
      .narrow {
        display: none;
      }
      .topics {
        display: none;
      }
      .folded > .heading,
      .topics > .heading:first-child {
        margin-top: 50.5px;
      }
      .more .thumbnail {
        background: none;
      }
      .more .thumbnail::before,
      .more .thumbnail > div,
      .more .thumbnail::after {
        content: "";
        position: absolute;
        width: 74%;
        height: 74%;
        border-radius: 6px;
      }
      .more .thumbnail::before {
        left: 20%;
        top: 6%;
        background: var(--stack-back);
      }
      .more .thumbnail > div {
        left: 13%;
        top: 13%;
        background: var(--stack-middle);
      }
      .more .thumbnail::after {
        left: 6%;
        top: 20%;
        background: var(--background);
      }
      .folder .thumbnail {
        aspect-ratio: 4 / 3;
        background: var(--placeholder);
        clip-path: polygon(0 0, 40% 0, 40% 7%, 100% 7%, 100% 100%, 0 100%);
      }
      @media (min-width: 664px) {
        .folded {
          display: none;
        }
        .topics {
          display: block;
        }
        .page {
          padding-top: 46px;
        }
        .cards {
          grid-template-columns: repeat(3, 1fr);
        }
        .line + .line:not([style]) {
          width: 60%;
        }
        .card:nth-child(3n + 2) .line + .line:not([style]) {
          width: 85%;
        }
        .card:nth-child(3n) .line + .line:not([style]) {
          width: 35%;
        }
      }
      @media (min-width: 664px) and (max-width: 1131px) {
        .narrow {
          display: block;
        }
      }
      .scene #loading {
        background: var(--scene);
      }
      .scene .page {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .window,
        .inner {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <div id="loading" role="status" aria-label="Loading" ontransitionend="if (event.target === this) this.remove()">
      <div class="page">
        <div class="bar title"></div>
        <div class="bar subtitle"></div>
        <div class="heading"><div class="bar" style="width: 148px"></div><div class="bar see-all" hidden></div></div>
        <div class="cards">
          <div class="card"><div class="thumbnail plus"></div><div class="bar name" style="width: 110px"></div><div class="bar line" style="width: 111px"></div></div>
        </div>
        <script>
          (() => {
            let saved = 0;
            try {
              saved = Number(localStorage.getItem("neuronify-saved-simulations")) || 0;
            } catch {}
            const cards = document.currentScript.previousElementSibling;
            const names = [70, 95, 55, 110, 80];
            const dates = [88, 118, 88, 60, 100];
            for (let i = 0; i < Math.min(saved, names.length); i++) {
              cards.insertAdjacentHTML(
                "beforeend",
                `<div class="card"><div class="thumbnail"></div><div class="bar name" style="width: ${names[i]}px"></div><div class="bar line" style="width: ${dates[i]}px"></div></div>`,
              );
            }
            cards.previousElementSibling.lastElementChild.hidden = saved <= names.length;
          })();
        </script>
        <div class="folded">
          <div class="heading"><div class="bar" style="width: 92px"></div></div>
          <div class="cards folders">
            <div class="card folder"><div class="thumbnail"></div><div class="bar name" style="width: 108px"></div><div class="bar line" style="width: 79px"></div></div>
            <div class="card folder"><div class="thumbnail"></div><div class="bar name" style="width: 60px"></div><div class="bar line" style="width: 73px"></div></div>
            <div class="card folder"><div class="thumbnail"></div><div class="bar name" style="width: 53px"></div><div class="bar line" style="width: 73px"></div></div>
            <div class="card folder"><div class="thumbnail"></div><div class="bar name" style="width: 67px"></div><div class="bar line" style="width: 73px"></div></div>
            <div class="card folder"><div class="thumbnail"></div><div class="bar name" style="width: 49px"></div><div class="bar line" style="width: 73px"></div></div>
            <div class="card folder"><div class="thumbnail"></div><div class="bar name" style="width: 58px"></div><div class="bar line" style="width: 73px"></div></div>
            <div class="card folder"><div class="thumbnail"></div><div class="bar name" style="width: 83px"></div><div class="bar line" style="width: 67px"></div></div>
          </div>
        </div>
        <div class="topics">
          <div class="heading"><div class="bar" style="width: 135px"></div><div class="bar see-all"></div></div>
          <div class="cards">
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 61px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 112px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 112px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 122px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 144px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card more"><div class="thumbnail"><div></div></div><div class="bar name" style="width: 46px"></div><div class="bar line" style="width: 35px"></div></div>
          </div>
          <div class="heading"><div class="bar" style="width: 75px"></div></div>
          <div class="cards">
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 80px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 60px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 113px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 125px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 121px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
          </div>
          <div class="heading"><div class="bar" style="width: 66px"></div></div>
          <div class="cards">
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 82px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 102px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 149px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 110px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
          </div>
          <div class="heading"><div class="bar" style="width: 84px"></div></div>
          <div class="cards">
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 89px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 139px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 120px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 134px"></div><div class="bar line"></div><div class="bar line"></div></div>
          </div>
          <div class="heading"><div class="bar" style="width: 61px"></div></div>
          <div class="cards">
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 113px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 151px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 140px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
          </div>
          <div class="heading"><div class="bar" style="width: 72px"></div></div>
          <div class="cards">
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 95px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 165px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 110px"></div><div class="bar line"></div><div class="bar line"></div></div>
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 185px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
          </div>
          <div class="heading"><div class="bar" style="width: 104px"></div></div>
          <div class="cards">
            <div class="card"><div class="thumbnail"></div><div class="bar name" style="width: 58px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line narrow"></div></div>
          </div>
        </div>
      </div>
      <div class="center" aria-hidden="true">
        <div class="tile">
          <canvas id="neuron"></canvas>
          <div class="icon"></div>
          <div class="panel">
            <div class="plot">
              <div class="window"><div class="inner" id="trace"></div></div>
            </div>
            <div class="status"><span>Loading</span><span id="percent">0 %</span></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
